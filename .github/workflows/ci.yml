name: CI & Build Workflow

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Verify
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Install frontend dependencies
        run: npm --prefix frontend install

      - name: Build React frontend (Vite)
        run: npm --prefix frontend run build

      - name: Verify SQLite database initialization & seeding
        run: |
          node -e "const { getDb } = require('./server/database'); const db = getDb(); const offices = db.prepare('SELECT COUNT(*) as count FROM office').get().count; const props = db.prepare('SELECT COUNT(*) as count FROM properties').get().count; console.log('Verification Success: ' + offices + ' offices, ' + props + ' properties loaded.');"
